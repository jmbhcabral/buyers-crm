services:
  db:
    image: postgres:16-alpine
    container_name: buyers_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - traefik-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyers_crm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      STORAGE_DIR: /app/storage/fotos
      IDEALISTA_DOWNLOAD_CONCURRENCY: ${IDEALISTA_DOWNLOAD_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-prod}
    volumes:
      - fotos_storage:/app/storage/fotos
      - pdfs_storage:/app/storage/pdfs
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-api.rule=Host(`crm.chanilaicastro.pt`) && PathPrefix(`/api`)"
      - "traefik.http.routers.crm-api.entrypoints=web"
      - "traefik.http.routers.crm-api.priority=100"
      - "traefik.http.services.crm-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buyers_crm_frontend
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-frontend.rule=Host(`crm.chanilaicastro.pt`)"
      - "traefik.http.routers.crm-frontend.entrypoints=web"
      - "traefik.http.routers.crm-frontend.priority=10"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true

volumes:
  postgres_data:
  fotos_storage:
  pdfs_storage:
