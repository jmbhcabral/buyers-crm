services:
  db:
    image: postgres:16-alpine
    container_name: buyers_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buyers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buyers}
      POSTGRES_DB: ${POSTGRES_DB:-buyers_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buyers} -d ${POSTGRES_DB:-buyers_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyers_crm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buyers}:${POSTGRES_PASSWORD:-buyers}@db:5432/${POSTGRES_DB:-buyers_crm}
      JWT_SECRET: ${JWT_SECRET:-muda-isto-em-producao}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      STORAGE_DIR: /app/storage/fotos
      ENV: dev
      LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - fotos_storage:/app/storage/fotos
      - pdfs_storage:/app/storage/pdfs
      - consultores_storage:/app/storage/consultores
    command: >
      sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
  fotos_storage:
  pdfs_storage:
  consultores_storage: